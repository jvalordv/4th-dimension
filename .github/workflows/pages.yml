# Build the viewer and publish dist/ to GitHub Pages.
#
# Runs on every push to the default branch (and to main, for when the repo
# gets one), or by hand from the Actions tab. The deploy step needs Pages to
# be enabled with source "GitHub Actions" (Settings → Pages); configure-pages
# tries to do that itself when the token is allowed to.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/pensive-mccarthy-hgrnyu, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
